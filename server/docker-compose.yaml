services:
  postgres:
    image: postgres:16 
    container_name: user-management-app 
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: users-db
    volumes:
      - postgres_data:/var/lib/postgresql/data # Mounts data to a named volume
    ports:
      - "5432:5432" # Maps host port 5432 to container port 5432

volumes:
  postgres_data:
    driver: local